<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#050713" />
  <meta name="description" content="32가지 실루엣으로 만든 10,000개의 프리즘 홀로그램 캐릭터 갤러리" />
  <meta property="og:title" content="Botland — 10,000 Hologram Characters" />
  <meta property="og:description" content="고양이·여우·해파리·용·공작 등 32가지 캐릭터가 모두 홀로그램으로 빛나는 컬렉션" />
  <meta property="og:type" content="website" />
  <title>Botland — 10,000 Hologram Characters</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 0,#143663,transparent 34rem),radial-gradient(circle at 90% 5%,#64145f,transparent 35rem),#050713;color:#f5f8ff;font-family:Inter,Pretendard,system-ui,-apple-system,sans-serif}.loader{width:min(560px,calc(100% - 32px));padding:38px 30px;border:1px solid #8af8ff55;border-radius:24px;background:#0b1122e8;text-align:center;box-shadow:0 30px 100px #0009,0 0 50px #61f8ff20}.orb{width:90px;height:90px;margin:0 auto 24px;border:2px solid transparent;border-top-color:#61f8ff;border-right-color:#ff62df;border-radius:50%;box-shadow:inset 0 0 25px #8b72ff44,0 0 30px #61f8ff33;animation:spin 1.4s linear infinite}.orb:after{content:"";display:block;width:48px;height:48px;margin:19px;border:1px solid #fff8;border-radius:50%;box-shadow:0 0 22px #ff62df66}.loader h1{margin:0 0 10px;font-size:clamp(1.8rem,7vw,3rem);letter-spacing:-.05em;background:linear-gradient(90deg,#61f8ff,#fff,#ff62df);-webkit-background-clip:text;color:transparent}.loader p{margin:0;color:#9aa8c6;line-height:1.7}.bar{height:4px;margin:25px 0 0;overflow:hidden;border-radius:999px;background:#ffffff12}.bar i{display:block;width:45%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#61f8ff,#ff62df);animation:load 1.1s ease-in-out infinite alternate}.error a{color:#61f8ff}@keyframes spin{to{transform:rotate(360deg)}}@keyframes load{to{transform:translateX(122%)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</head>
<body>
  <main class="loader" id="status">
    <div class="orb" aria-hidden="true"></div>
    <h1>BOTLAND HOLOGRAMS</h1>
    <p>32가지 캐릭터 실루엣과 10,000개의 홀로그램을 불러오는 중입니다.</p>
    <div class="bar" aria-hidden="true"><i></i></div>
  </main>
  <script>
    (async()=>{
      const source='https://raw.githubusercontent.com/beerAndNacho/botlandgallary/main/.holo-upgrade/site.html.gz.b64?v=002cadda091fbb3a330164b5ac31908442c9c188';
      try{
        if(!('DecompressionStream' in self))throw new Error('이 브라우저는 압축 해제를 지원하지 않습니다.');
        const response=await fetch(source,{cache:'no-store'});
        if(!response.ok)throw new Error('홀로그램 데이터를 불러오지 못했습니다: '+response.status);
        const encoded=(await response.text()).replace(/\s/g,'');
        const bytes=Uint8Array.from(atob(encoded),character=>character.charCodeAt(0));
        const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
        const html=await new Response(stream).text();
        if(!html.includes('32 SILHOUETTES')||!html.includes('10,000 홀로그램'))throw new Error('홀로그램 데이터 검증에 실패했습니다.');
        document.open();document.write(html);document.close();
      }catch(error){
        document.getElementById('status').innerHTML='<div class="error"><h1>BOTLAND HOLOGRAMS</h1><p>'+String(error.message||error)+'</p><p style="margin-top:18px"><a href="https://github.com/beerAndNacho/botlandgallary">저장소에서 확인하기</a></p></div>';
      }
    })();
  </script>
</body>
</html>
