<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070815"><meta name="description" content="10,000개의 오리지널 홀로그램 마스코트 컬렉션"><title>Botland 10,000 Gallery</title><style>
:root{color-scheme:dark;--bg:#070815;--p:#11142a;--t:#f8f8ff;--m:#aab2d1;--l:#ffffff1d;--c:#6ef7ff;--pk:#ff70df;font-family:Inter,Pretendard,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#15406f44,transparent 35rem),radial-gradient(circle at 95% 0,#6d176844,transparent 34rem),var(--bg);color:var(--t)}button,input,select{font:inherit;color:inherit}.w{width:min(1240px,calc(100% - 24px));margin:auto}header{position:sticky;top:0;z-index:20;border-bottom:1px solid var(--l);background:#070815e8;backdrop-filter:blur(18px)}.hi{height:65px;display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{font-weight:950;text-decoration:none}.logo b{color:var(--c)}.btn{min-height:40px;border:1px solid var(--l);border-radius:13px;background:#ffffff0a;padding:0 13px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn:hover{border-color:#6ef7ff88}.primary{color:#080916;border:0;background:linear-gradient(110deg,var(--c),white 38%,var(--pk),#fff275)}.hero{padding:47px 0 25px}.hero h1{font-size:clamp(36px,6vw,68px);line-height:1;margin:0 0 13px;letter-spacing:-.07em}.hero p{color:var(--m);margin:0;line-height:1.7}.tools{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:9px;padding:15px;border:1px solid var(--l);border-radius:20px;background:#11142ad9;margin:13px 0 18px}.tools input,.tools select{height:45px;border:1px solid var(--l);border-radius:13px;background:#090b1c;padding:0 12px;outline:0}.count{display:flex;justify-content:space-between;color:var(--m);font-size:13px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:13px}.card{--rx:0deg;--ry:0deg;position:relative;border:1px solid var(--l);border-radius:20px;background:linear-gradient(150deg,#151a38,#0b0d20);padding:10px;transform:perspective(800px) rotateX(var(--rx)) rotateY(var(--ry));transition:.16s;cursor:pointer;overflow:hidden}.card:hover{border-color:#6ef7ff77}.card svg{width:100%;aspect-ratio:1;display:block;filter:drop-shadow(0 12px 14px #0008)}.card h3{margin:6px 2px 2px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:flex;justify-content:space-between;color:var(--m);font-size:10px;margin:0 2px}.fav{position:absolute;right:8px;top:8px;width:31px;height:31px;border:1px solid var(--l);border-radius:10px;background:#090b19c9;z-index:3}.fav.on{color:#ff80bb}.pages{display:flex;justify-content:center;gap:8px;padding:28px 0 72px}.pages button{min-width:42px;height:42px;border:1px solid var(--l);border-radius:12px;background:#11142a}.pages button.on{color:#080916;background:var(--c)}dialog{width:min(920px,calc(100% - 20px));border:1px solid #6ef7ff55;border-radius:25px;padding:0;background:#0b0e21;color:var(--t);box-shadow:0 40px 120px #000d}dialog::backdrop{background:#02030bd9;backdrop-filter:blur(7px)}.detail{display:grid;grid-template-columns:1.05fr .95fr;gap:20px;padding:20px}.art{border:1px solid var(--l);border-radius:21px;background:radial-gradient(circle at 30% 15%,#6ef7ff24,transparent 35%),radial-gradient(circle at 80% 20%,#ff70df24,transparent 35%),#11142a;padding:15px}.art svg{width:100%}.info{padding:8px}.info h2{font-size:38px;margin:15px 0 7px;letter-spacing:-.05em}.info p{color:var(--m);line-height:1.7}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:20px 0}.stat{padding:12px;border:1px solid var(--l);border-radius:13px;background:#ffffff08}.stat small{display:block;color:var(--m);margin-bottom:4px}.acts{display:grid;grid-template-columns:1fr 1fr;gap:9px}.close{position:absolute;right:14px;top:14px;width:38px;height:38px;border:1px solid var(--l);border-radius:12px;background:#090b19}.empty{grid-column:1/-1;text-align:center;padding:70px;color:var(--m);border:1px dashed var(--l);border-radius:20px}@media(max-width:980px){.grid{grid-template-columns:repeat(4,1fr)}.tools{grid-template-columns:1fr 1fr}}@media(max-width:620px){.grid{grid-template-columns:repeat(2,1fr)}.tools{grid-template-columns:1fr}.detail{grid-template-columns:1fr}.info h2{font-size:29px}.hi .btn:first-of-type{display:none}.card{padding:7px}.w{width:calc(100% - 18px)}}@media(prefers-reduced-motion:reduce){.card{transform:none!important;transition:none!important}}
</style></head><body><header><div class="w hi"><a class="logo" href="./"><b>✦ BOTLAND</b> 10,000 GALLERY</a><div style="display:flex;gap:8px"><a class="btn" href="./">캐릭터 만들기</a><button class="btn" id="random">랜덤 보기</button></div></div></header><main class="w"><section class="hero"><h1>10,000개의<br><span style="background:linear-gradient(90deg,#6ef7ff,#fff,#ff70df,#fff275);-webkit-background-clip:text;color:transparent">홀로그램 친구들</span></h1><p>번호마다 항상 같은 오리지널 마스코트가 생성됩니다. 검색하고 수집하고 SVG·PNG로 저장해 보세요.</p></section><section class="tools"><input id="search" placeholder="이름 또는 번호 검색 (예: 4243)"><select id="species"><option value="">모든 종족</option></select><select id="rarity"><option value="">모든 희귀도</option><option>COMMON</option><option>RARE</option><option>EPIC</option><option>LEGENDARY</option></select><select id="sort"><option value="id">번호순</option><option value="rare">희귀도순</option><option value="random">랜덤순</option></select></section><div class="count"><span id="result">10,000개</span><span>페이지당 48개</span></div><section class="grid" id="grid"></section><div class="pages" id="pages"></div></main><dialog id="dialog"><button class="close" id="close">×</button><div class="detail"><div class="art" id="art"></div><div class="info"><span id="badge"></span><h2 id="name"></h2><p id="desc"></p><div class="stats" id="stats"></div><div class="acts"><button class="btn primary" id="png">PNG 저장</button><button class="btn" id="svg">SVG 저장</button></div></div></div></dialog><script>
(()=>{const N=10000,PER=48,S=[['fox','별여우','🦊'],['cat','구름고양이','🐱'],['rabbit','달토끼','🐰'],['otter','물수달','🦦'],['dragon','꼬마용','🐲'],['bear','새싹곰','🐻'],['dog','번개강아지','🐶'],['raccoon','오로라라쿤','🦝'],['penguin','수정펭귄','🐧'],['frog','젤리개구리','🐸'],['axolotl','별가루아홀로틀','🫧'],['squirrel','빛다람쥐','🐿️']],P=[['오로라','#73f7ff','#9a78ff','#ff78df'],['레몬팝','#fff36d','#ff8d55','#6fdcff'],['딸기소다','#ff7fae','#ffe1ed','#9c82ff'],['민트구름','#77ffc1','#eafff7','#67bfff'],['은하수','#736dff','#14174a','#ff75e5'],['복숭아빛','#ff9b83','#fff0cf','#ff70bb'],['바다유리','#58d8ff','#d7ffff','#5c7dff'],['숲의빛','#8ee36c','#fff27a','#48c9a2']],E=[['별빛','✦'],['전기','⚡'],['물','💧'],['숲','🌱'],['불꽃','🔥'],['달','☾'],['얼음','❄'],['꿈','☁']],R=['COMMON','RARE','EPIC','LEGENDARY'],A=['루','미','모','하','코','라','별','소','나','리','토','유'],B=['미','루','링','몽','콩','비','니','아','엘','온','푸','리'];let page=1,list=[],current;const $=q=>document.querySelector(q),favKey='botland-gallery-favs';function h(s){let x=+s||1;x=Math.imul(x^x>>>16,2246822507);x=Math.imul(x^x>>>13,3266489909);return(x^x>>>16)>>>0}function bot(id){let q=h(id*2654435761),si=q%S.length,pi=(q>>>5)%P.length,ri=q%100<4?3:q%100<17?2:q%100<46?1:0,ei=(q>>>11)%E.length;return{id,si,pi,ri,ei,name:A[q%A.length]+B[(q>>>8)%B.length]+' '+S[si][1]}}function all(){return Array.from({length:N},(_,i)=>bot(i+1))}function ears(t,c1,c2){if(t==='rabbit')return `<ellipse cx="278" cy="177" rx="36" ry="105" fill="${c1}"/><ellipse cx="522" cy="177" rx="36" ry="105" fill="${c1}"/><ellipse cx="278" cy="177" rx="16" ry="75" fill="${c2}"/><ellipse cx="522" cy="177" rx="16" ry="75" fill="${c2}"/>`;if(['penguin','frog','axolotl'].includes(t))return t==='frog'?`<circle cx="300" cy="225" r="55" fill="${c1}"/><circle cx="500" cy="225" r="55" fill="${c1}"/>`:t==='axolotl'?`<path d="M260 250l-70-65 25 80-52-10M540 250l70-65-25 80 52-10" fill="none" stroke="${c2}" stroke-width="25" stroke-linecap="round"/>`:'';if(t==='dragon')return `<path d="M305 220l-38-98 82 78M495 220l38-98-82 78" fill="${c2}" stroke="${c1}" stroke-width="12"/>`;if(['fox','cat','dog','raccoon','squirrel'].includes(t))return `<path d="M247 277Q220 135 338 221Z" fill="${c1}"/><path d="M553 277Q580 135 462 221Z" fill="${c1}"/><path d="M263 241Q252 183 310 220Z" fill="${c2}"/><path d="M537 241Q548 183 490 220Z" fill="${c2}"/>`;return `<circle cx="290" cy="218" r="55" fill="${c1}"/><circle cx="510" cy="218" r="55" fill="${c1}"/>`}function tail(t,c1,c2){if(['penguin','frog','axolotl'].includes(t))return '';if(t==='squirrel')return `<path d="M540 520q145-122 177 10q28 113-102 150q63-89-48-83z" fill="${c1}"/>`;return `<path d="M532 534q165-64 163 76q-2 112-130 103q58-53-32-86z" fill="${c1}"/><path d="M618 681q59-18 77-71q-5 104-113 101z" fill="${c2}"/>`}function svg(o){let p=P[o.pi],t=S[o.si][0],c1=p[1],c2=p[2],c3=p[3];return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800"><defs><linearGradient id="b${o.id}" x1="0" y1="0" x2="1" y2="1"><stop stop-color="white"/><stop offset=".35" stop-color="${c2}"/><stop offset=".72" stop-color="${c1}"/><stop offset="1" stop-color="${c3}"/></linearGradient><radialGradient id="e${o.id}"><stop stop-color="white"/><stop offset=".22" stop-color="${c1}"/><stop offset=".65" stop-color="${c3}"/><stop offset="1" stop-color="#19152d"/></radialGradient></defs><ellipse cx="400" cy="724" rx="210" ry="32" fill="#000" opacity=".25"/>${tail(t,c1,c2)}${ears(t,c1,c3)}<ellipse cx="400" cy="553" rx="157" ry="170" fill="url(#b${o.id})" stroke="white" stroke-width="8"/><ellipse cx="400" cy="330" rx="218" ry="197" fill="url(#b${o.id})" stroke="white" stroke-width="9"/><ellipse cx="322" cy="355" rx="51" ry="65" fill="#171429"/><ellipse cx="478" cy="355" rx="51" ry="65" fill="#171429"/><ellipse cx="322" cy="362" rx="37" ry="50" fill="url(#e${o.id})"/><ellipse cx="478" cy="362" rx="37" ry="50" fill="url(#e${o.id})"/><circle cx="305" cy="332" r="15" fill="white"/><circle cx="461" cy="332" r="15" fill="white"/><path d="M361 437q39 64 78 0q-39 23-78 0" fill="#8d2949"/><ellipse cx="400" cy="472" rx="24" ry="13" fill="#ff839f"/><ellipse cx="259" cy="437" rx="38" ry="18" fill="#ff7f9f" opacity=".65"/><ellipse cx="541" cy="437" rx="38" ry="18" fill="#ff7f9f" opacity=".65"/><path d="M310 563q-93 21-83 114q15 55 74 8q-18-45 39-67M490 563q93 21 83 114q-15 55-74 8q18-45-39-67" fill="url(#b${o.id})" stroke="white" stroke-width="8"/><ellipse cx="340" cy="690" rx="71" ry="51" fill="url(#b${o.id})" stroke="white" stroke-width="8"/><ellipse cx="460" cy="690" rx="71" ry="51" fill="url(#b${o.id})" stroke="white" stroke-width="8"/><path d="M400 220l14 29 32 5-23 22 6 32-29-15-29 15 6-32-23-22 32-5z" fill="${c3}" stroke="white" stroke-width="6"/></svg>`}function favs(){try{return JSON.parse(localStorage.getItem(favKey)||'[]')}catch{return[]}}function setFav(a){try{localStorage.setItem(favKey,JSON.stringify(a))}catch{}}function filter(){let q=$('#search').value.trim().toLowerCase(),s=$('#species').value,r=$('#rarity').value;list=all().filter(o=>(!q||String(o.id).includes(q)||o.name.toLowerCase().includes(q))&&(!s||String(o.si)===s)&&(!r||R[o.ri]===r));let sort=$('#sort').value;if(sort==='rare')list.sort((a,b)=>b.ri-a.ri||a.id-b.id);if(sort==='random')list.sort((a,b)=>h(a.id+777)-h(b.id+777));page=1;render()}function render(){let f=favs(),start=(page-1)*PER,rows=list.slice(start,start+PER);$('#result').textContent=`${list.length.toLocaleString()}개`;$('#grid').innerHTML=rows.length?rows.map(o=>`<article class="card" data-id="${o.id}"><button class="fav${f.includes(o.id)?' on':''}" data-fav="${o.id}">♥</button>${svg(o)}<h3>${o.name}</h3><div class="meta"><span>#${String(o.id).padStart(5,'0')}</span><span>${R[o.ri]}</span></div></article>`).join(''):'<div class="empty">검색 결과가 없습니다.</div>';let n=Math.ceil(list.length/PER),a=Math.max(1,page-2),z=Math.min(n,a+4);a=Math.max(1,z-4);$('#pages').innerHTML=n>1?Array.from({length:z-a+1},(_,i)=>a+i).map(x=>`<button class="${x===page?'on':''}" data-page="${x}">${x}</button>`).join(''):'';document.querySelectorAll('.card').forEach(tilt);document.querySelectorAll('[data-page]').forEach(x=>x.onclick=()=>{page=+x.dataset.page;render();scrollTo({top:250,behavior:'smooth'})});document.querySelectorAll('[data-fav]').forEach(x=>x.onclick=e=>{e.stopPropagation();let a=favs(),id=+x.dataset.fav;a=a.includes(id)?a.filter(v=>v!==id):[...a,id];setFav(a);render()});document.querySelectorAll('[data-id]').forEach(x=>x.onclick=e=>{if(e.target.closest('[data-fav]'))return;open(bot(+x.dataset.id))})}function tilt(el){el.onpointermove=e=>{let r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;el.style.setProperty('--ry',`${(x-.5)*11}deg`);el.style.setProperty('--rx',`${(.5-y)*11}deg`)};el.onpointerleave=()=>{el.style.setProperty('--ry','0deg');el.style.setProperty('--rx','0deg')}}function open(o){current=o;$('#art').innerHTML=svg(o);$('#badge').textContent=`${R[o.ri]} · #${String(o.id).padStart(5,'0')}`;$('#name').textContent=o.name;$('#desc').textContent=`${S[o.si][1]} 계열의 ${E[o.ei][0]} 속성 홀로그램 마스코트입니다. 같은 번호를 입력하면 언제나 동일한 모습으로 다시 생성됩니다.`;$('#stats').innerHTML=`<div class="stat"><small>종족</small>${S[o.si][2]} ${S[o.si][1]}</div><div class="stat"><small>팔레트</small>${P[o.pi][0]}</div><div class="stat"><small>속성</small>${E[o.ei][1]} ${E[o.ei][0]}</div><div class="stat"><small>희귀도</small>${R[o.ri]}</div>`;$('#dialog').showModal()}function file(n,b){let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function saveSvg(){file(`botland-${current.id}.svg`,new Blob([svg(current)],{type:'image/svg+xml'}))}function savePng(){let i=new Image();i.onload=()=>{let c=document.createElement('canvas');c.width=c.height=1024;c.getContext('2d').drawImage(i,0,0,1024,1024);c.toBlob(b=>file(`botland-${current.id}.png`,b))};i.src='data:image/svg+xml,'+encodeURIComponent(svg(current))}$('#species').innerHTML+='<option value="-1">즐겨찾기만</option>'+S.map((x,i)=>`<option value="${i}">${x[1]}</option>`).join('');['search','species','rarity','sort'].forEach(x=>$('#'+x).oninput=filter);$('#random').onclick=()=>open(bot(1+Math.floor(Math.random()*N)));$('#close').onclick=()=>$('#dialog').close();$('#svg').onclick=saveSvg;$('#png').onclick=savePng;list=all();render()})();
</script></body></html>
