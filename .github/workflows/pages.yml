name: Deploy Botland Hologram Gallery

on:
  push:
    branches: [main]
    paths-ignore:
      - deployment-status.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: botland-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build a self-contained Pages site
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import json
          import re

          payload = Path('.holo-upgrade/site.html.gz.b64')
          if not payload.is_file() or payload.stat().st_size == 0:
              raise SystemExit('hologram payload is missing')

          encoded = ''.join(payload.read_text(encoding='utf-8').split())
          encoded += '=' * (-len(encoded) % 4)
          compressed = base64.b64decode(encoded, validate=True)
          html = gzip.decompress(compressed).decode('utf-8')

          required = [
              '32 SILHOUETTES',
              '10,000 홀로그램',
              'const N=1e4',
              'new Set(cat.map(o=>o.sig)).size!==N',
              'PNG 저장',
              'SVG 저장',
              'RGB 잔상',
              '스캔라인',
          ]
          missing = [token for token in required if token not in html]
          if missing:
              raise SystemExit(f'missing gallery features: {missing}')
          if html.count('case ') < 32:
              raise SystemExit('character silhouette cases are incomplete')

          script = re.search(r'<script>([\s\S]*?)</script>', html)
          if not script:
              raise SystemExit('inline gallery script was not found')

          output = Path('pages-dist')
          output.mkdir(exist_ok=True)
          (output / 'index.html').write_text(html, encoding='utf-8')
          (output / '404.html').write_text(html, encoding='utf-8')
          (output / '.nojekyll').write_text('', encoding='utf-8')
          (output / 'health.json').write_text(
              json.dumps({
                  'status': 'ok',
                  'edition': 'self-contained-v4',
                  'characters': 10000,
                  'silhouettes': 32,
                  'runtime_base64_decode': False,
              }, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(f'Built self-contained gallery: {len(html):,} bytes')
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('pages-dist/index.html').read_text(encoding='utf-8')
          script = re.search(r'<script>([\s\S]*?)</script>', html)
          Path('/tmp/botland-gallery.js').write_text(script.group(1), encoding='utf-8')
          PY
          node --check /tmp/botland-gallery.js

      - name: Publish directly to gh-pages
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf /tmp/botland-gh-pages
          git worktree add --detach /tmp/botland-gh-pages origin/gh-pages
          cd /tmp/botland-gh-pages
          git switch -C gh-pages
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$GITHUB_WORKSPACE/pages-dist/." .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'gh-pages is already current'
          else
            git commit -m "deploy: publish self-contained hologram gallery"
            git push origin HEAD:gh-pages
          fi
