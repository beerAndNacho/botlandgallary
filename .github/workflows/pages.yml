name: Publish Botland Hologram Gallery

on:
  push:
    branches: [main]
    paths-ignore:
      - deployment-status.json
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Materialize the hologram edition
        run: |
          set -euo pipefail
          payload=.holo-upgrade/site.html.gz.b64
          test -s "$payload"
          tr -d '\n\r ' < "$payload" | base64 --decode | gzip --decompress > /tmp/botland-hologram.html
          grep -q "32 SILHOUETTES" /tmp/botland-hologram.html
          grep -q "10,000 홀로그램" /tmp/botland-hologram.html
          cp /tmp/botland-hologram.html index.html
          mkdir -p standalone
          cp /tmp/botland-hologram.html standalone/index.html
          cp /tmp/botland-hologram.html standalone/404.html
          touch standalone/.nojekyll
          printf '{"status":"ok","edition":"hologram-v3","characters":10000,"silhouettes":32,"source_commit":"%s"}\n' "$(git rev-parse HEAD)" > standalone/health.json

      - name: Validate catalog and browser script
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          match = re.search(r"<script>([\s\S]*?)</script>", html)
          if not match:
              raise SystemExit("inline gallery script was not found")
          Path("/tmp/botland-hologram.js").write_text(match.group(1), encoding="utf-8")
          required = [
              "const N=1e4",
              "new Set(cat.map(o=>o.sig)).size!==N",
              "PNG 저장",
              "SVG 저장",
              "RGB 잔상",
              "스캔라인",
          ]
          missing = [token for token in required if token not in html]
          if missing:
              raise SystemExit(f"missing gallery features: {missing}")
          if html.count("case ") < 32:
              raise SystemExit("character silhouette cases are incomplete")
          PY
          node --check /tmp/botland-hologram.js

      - name: Commit generated source files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html standalone/index.html standalone/404.html standalone/.nojekyll standalone/health.json
          if ! git diff --cached --quiet; then
            git commit -m "build: refresh hologram gallery source [skip ci]"
            git push origin HEAD:main
          fi

      - name: Publish files to gh-pages
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf /tmp/botland-pages
          git worktree add -B gh-pages /tmp/botland-pages origin/gh-pages
          find /tmp/botland-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp standalone/index.html /tmp/botland-pages/index.html
          cp standalone/404.html /tmp/botland-pages/404.html
          cp standalone/health.json /tmp/botland-pages/health.json
          touch /tmp/botland-pages/.nojekyll
          cd /tmp/botland-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "deploy: publish Botland hologram gallery"
            git push origin HEAD:gh-pages
          fi
          cd "$GITHUB_WORKSPACE"
          git worktree remove /tmp/botland-pages --force

      - name: Request legacy Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/pages-build.json -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages/builds")
          cat /tmp/pages-build.json
          case "$code" in
            201|204|409) ;;
            *) echo "Unexpected Pages build response: HTTP $code" >&2; exit 1 ;;
          esac

  record:
    if: always()
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Query Pages and write deployment status
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages" || true)
          export PAGES_HTTP_CODE="$code"
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          import os

          raw = Path("/tmp/pages.json").read_text(encoding="utf-8") if Path("/tmp/pages.json").exists() else ""
          try:
              payload = json.loads(raw) if raw else {}
          except json.JSONDecodeError:
              payload = {"raw": raw[:1000]}

          status = {
              "observed_at": datetime.now(timezone.utc).isoformat(),
              "workflow_commit": os.environ.get("GITHUB_SHA"),
              "publish_result": os.environ.get("PUBLISH_RESULT"),
              "pages_api_http_status": os.environ.get("PAGES_HTTP_CODE"),
              "expected_url": "https://beerandnacho.github.io/botlandgallary/",
              "html_url": payload.get("html_url"),
              "status": payload.get("status"),
              "build_type": payload.get("build_type"),
              "source": payload.get("source"),
              "error": payload.get("message") or payload.get("error"),
          }
          Path("deployment-status.json").write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY

      - name: Commit deployment status
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment-status.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: record Pages deployment status [skip ci]"
            git push origin HEAD:main
          fi
