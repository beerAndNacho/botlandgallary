name: Validate Botland Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: botland-pages-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch the live Pages branch
        run: git fetch origin gh-pages

      - name: Validate creator homepage and gallery
        shell: bash
        run: |
          set -euo pipefail
          git show origin/gh-pages:index.html > /tmp/index.html
          git show origin/gh-pages:creator.css > /tmp/creator.css
          git show origin/gh-pages:creator.js > /tmp/creator.js
          git show origin/gh-pages:gallery.html > /tmp/gallery.html
          git show origin/gh-pages:health.json > /tmp/health.json

          grep -q 'BOTLAND CHARACTER STUDIO' /tmp/index.html
          grep -q 'id="creator"' /tmp/index.html
          grep -q 'PNG 저장' /tmp/index.html
          grep -q 'SVG 저장' /tmp/index.html
          grep -q '10,000개의' /tmp/gallery.html
          grep -q 'const N=10000' /tmp/gallery.html
          grep -q 'creator_species' /tmp/health.json
          node --check /tmp/creator.js

          python3 - <<'PY'
          from pathlib import Path
          import json
          health = json.loads(Path('/tmp/health.json').read_text(encoding='utf-8'))
          assert health['status'] == 'ok'
          assert health['homepage_creator'] is True
          assert health['creator_species'] == 12
          assert health['catalog_characters'] == 10000
          print(health)
          PY
