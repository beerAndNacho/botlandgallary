name: Publish Botland Hologram Gallery

on:
  push:
    branches: [main]
    paths-ignore:
      - deployment-status.json
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Materialize the hologram edition
        run: |
          set -euo pipefail
          payload=.holo-upgrade/site.html.gz.b64
          test -s "$payload"
          tr -d '\n\r ' < "$payload" | base64 --decode | gzip --decompress > /tmp/botland-hologram.html
          grep -q "32 SILHOUETTES" /tmp/botland-hologram.html
          grep -q "10,000 홀로그램" /tmp/botland-hologram.html
          cp /tmp/botland-hologram.html index.html
          mkdir -p standalone
          cp /tmp/botland-hologram.html standalone/index.html
          cp /tmp/botland-hologram.html standalone/404.html
          touch standalone/.nojekyll
          printf '{"status":"ok","edition":"hologram-v2","characters":10000,"silhouettes":32,"source_commit":"%s"}\n' "$(git rev-parse HEAD)" > standalone/health.json

      - name: Validate catalog and browser script
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          match = re.search(r"<script>([\s\S]*?)</script>", html)
          if not match:
              raise SystemExit("inline gallery script was not found")
          Path("/tmp/botland-hologram.js").write_text(match.group(1), encoding="utf-8")
          required = [
              "const N=1e4",
              "new Set(cat.map(o=>o.sig)).size!==N",
              "PNG 저장",
              "SVG 저장",
              "RGB 잔상",
              "스캔라인",
          ]
          missing = [token for token in required if token not in html]
          if missing:
              raise SystemExit(f"missing gallery features: {missing}")
          if html.count("case ") < 32:
              raise SystemExit("character silhouette cases are incomplete")
          PY
          node --check /tmp/botland-hologram.js

      - name: Commit generated source files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html standalone/index.html standalone/404.html standalone/.nojekyll standalone/health.json
          if ! git diff --cached --quiet; then
            git commit -m "build: refresh hologram gallery source [skip ci]"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: standalone

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
