name: Build and Deploy Motion Studio

on:
  push:
    branches: [main]
    paths:
      - 'motion/**'
      - '.github/workflows/motion.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: botland-motion-studio
  cancel-in-progress: true

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Materialize staged Motion Studio source
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G 'motion/source-parts/part-*' > /dev/null; then
            cp .github/workflows/motion.yml /tmp/motion-workflow.yml
            cat motion/source-parts/part-* > /tmp/motion-source.tar.xz.b64
            base64 --decode /tmp/motion-source.tar.xz.b64 > /tmp/motion-source.tar.xz
            echo 'cd4e87103fee8cffc3bc4b1f9fef4a20e7d2b214473945ce3e4f363fd4a5bb89  /tmp/motion-source.tar.xz' | sha256sum --check
            tar -xJf /tmp/motion-source.tar.xz -C .
            cp /tmp/motion-workflow.yml .github/workflows/motion.yml

            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -f motion/tools motion/web motion/tests motion/README.md motion/ATTRIBUTION.md motion/package.json
            git rm -r motion/source-parts
            git commit -m 'feat: materialize CMU Motion Studio source [skip ci]'
            git push origin HEAD:main
          else
            echo 'Readable Motion Studio source is already present.'
          fi

      - name: Normalize clip heading and preserve mps before seam smoothing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          changes = []

          core_path = Path('motion/web/mocap-core.js')
          core = core_path.read_text(encoding='utf-8')
          old_core = "  const c = Math.cos(-heading);\n  const s = Math.sin(-heading);"
          new_core = "  // poseHeading is the rotation that takes the captured facing direction back to canonical -z.\n  const c = Math.cos(heading);\n  const s = Math.sin(heading);"
          if old_core in core:
              core = core.replace(old_core, new_core, 1)
              core_path.write_text(core, encoding='utf-8')
              changes.append(str(core_path))
          elif new_core not in core:
              raise SystemExit('canonicalizePose heading block was not recognized')

          converter_path = Path('motion/tools/bvh_to_mocap.py')
          converter = converter_path.read_text(encoding='utf-8')
          old_converter = (
              "    if auto_loop:\n"
              "        resampled, _ = autoloop(resampled, fps)\n"
              "    if smoothloop:\n"
              "        smooth_loop(resampled, smoothloop)\n"
              "    settle_and_origin(resampled)\n"
              "    mps = make_inplace(resampled, fps) if inplace else None\n"
          )
          new_converter = (
              "    if auto_loop:\n"
              "        resampled, _ = autoloop(resampled, fps)\n"
              "    # Measure the original horizontal root trajectory before any loop seam blend.\n"
              "    # Blending a translating root toward frame zero inflates mps and causes foot slip.\n"
              "    settle_and_origin(resampled)\n"
              "    mps = make_inplace(resampled, fps) if inplace else None\n"
              "    if smoothloop:\n"
              "        smooth_loop(resampled, smoothloop)\n"
              "        settle_and_origin(resampled)\n"
          )
          if old_converter in converter:
              converter = converter.replace(old_converter, new_converter, 1)
              converter_path.write_text(converter, encoding='utf-8')
              changes.append(str(converter_path))
          elif new_converter not in converter:
              raise SystemExit('converter post-processing block was not recognized')

          print('source corrections:', ', '.join(changes) if changes else 'already applied')
          PY

          if ! git diff --quiet -- motion/web/mocap-core.js motion/tools/bvh_to_mocap.py; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add motion/web/mocap-core.js motion/tools/bvh_to_mocap.py
            git commit -m 'fix: align CMU heading and retain original locomotion speed [skip ci]'
            git push origin HEAD:main
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Run pure-Python BVH converter tests
        run: python -m unittest discover -s motion/tests -p 'test_*.py' -v

      - name: Run deterministic sequencing and renderer tests
        run: node --test motion/tests/test_motion_core.mjs

      - name: Build real CMU demo clips
        run: python motion/tools/build_demo.py motion/dist/motion

      - name: Run real-data acceptance tests
        env:
          MOTION_CLIPS_DIR: motion/dist/motion/clips
        run: node --test motion/tests/test_real_clips.mjs

      - name: Validate static output and attribution
        shell: bash
        run: |
          set -euo pipefail
          test -s motion/dist/motion/index.html
          test -s motion/dist/motion/app.js
          test -s motion/dist/motion/mocap-core.js
          test -s motion/dist/motion/mocap-renderer.js
          test -s motion/dist/motion/clips/manifest.json
          test -s motion/dist/motion/clips/index.json
          grep -q 'The data used in this project was obtained from mocap.cs.cmu.edu' motion/dist/motion/index.html
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('motion/dist/motion/clips/manifest.json').read_text())
          assert manifest['jointCount'] == 19
          assert manifest['fps'] == 30
          assert len(manifest['clips']) >= 8
          for item in manifest['clips']:
              clip = json.loads((Path('motion/dist/motion/clips') / item['file']).read_text())
              assert clip['kind'] == 'mocap'
              assert clip['n'] * 57 == len(clip['j'])
              assert len(clip['order']) == 19
          print('validated', len(manifest['clips']), 'real CMU clips')
          PY

      - name: Publish /motion to gh-pages without replacing the character site
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf /tmp/botland-pages
          git worktree add --detach /tmp/botland-pages origin/gh-pages
          cd /tmp/botland-pages
          git switch -C gh-pages
          rm -rf motion
          cp -a "$GITHUB_WORKSPACE/motion/dist/motion" motion
          touch .nojekyll
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add motion .nojekyll
          if git diff --cached --quiet; then
            echo 'Motion Studio is already current'
          else
            git commit -m 'deploy: publish CMU Motion Studio'
            git push origin HEAD:gh-pages
          fi
