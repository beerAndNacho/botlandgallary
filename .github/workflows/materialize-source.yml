name: Materialize source files

on:
  push:
    branches: [main]
    paths:
      - "source-parts/**"
      - "scripts/assemble-source.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-source
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify and restore source files
        run: node scripts/assemble-source.mjs

      - name: Commit readable source files
        shell: bash
        run: |
          if [ ! -d source-parts ]; then
            echo "Source files are already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f src/bot-engine.ts src/main.ts src/styles.css
          git rm -r source-parts
          git commit -m "chore: materialize readable source files"
          git push
